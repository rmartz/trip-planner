version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # NOTE: no `cooldown` on the npm ecosystem (deliberately — do not re-add).
    # Dependabot enforces `cooldown` by passing pnpm a `minimumReleaseAge`, and
    # every branch rebase (required to keep a PR current with main before merge)
    # regenerates the lockfile with the *latest* transitive dependencies — in a
    # fast-moving tree some are almost always younger than the window. That made
    # the release-age CI gate fail on essentially every rebase, so these PRs
    # could not be merged without retrying for a lucky freshness window. The gate
    # (.github/workflows/release-age.yml + scripts/check-release-age*) and this
    # cooldown were removed together. The github-actions ecosystem below also
    # uses no `cooldown`: cooldowns add merge friction without reliably closing
    # the supply-chain window (Dependabot keeps PRs current, so even an
    # older-release bump pulls the latest transitive deps), so none is used
    # anywhere — do not re-add.
    commit-message:
      prefix: "chore"
      include: "scope"
    # Grouping strategy — DEFAULT TO GROUPED, split out only on demonstrated need
    # (issue #532, correcting #526/#528; measured over time by the standing
    # "Dependabot grouping audit" issue that scripts/dependabot-audit.mjs
    # produces). Order matters: Dependabot assigns each bump to the FIRST group
    # whose patterns/update-types/dependency-type all match.
    #
    # The DEFAULT is two base groups: every dev dependency batches into
    # dev-dependencies, every prod dependency into production-dependencies, across
    # ALL update types (one low-noise PR per boundary per week). A package is
    # split into its own group ONLY when it has earned one, for one of two
    # reasons:
    #   * FUNCTIONAL — it must move in lockstep ACROSS the prod/dev boundary, so a
    #     base group (which is per-boundary) would split it. Only `react`
    #     qualifies (react/react-dom are prod; the @types are dev). A
    #     single-boundary lockstep family needs no split: its base group already
    #     batches that whole boundary into one PR, so the members move together.
    #   * DATA — the audit shows the package repeatedly breaks or blocks its base
    #     group. Only `typescript` qualifies so far: the 6→7 major failed CI
    #     across four PRs (#461/#480/#485/#490) and never merged, so isolating it
    #     keeps a stuck compiler bump from blocking the whole dev batch.
    #
    # Everything else — the former redux/storybook/vite/eslint/tailwind
    # "version-locked family" split-outs and the former prettier isolation, all
    # added WITHOUT data — is folded back into the base groups. Re-split a package
    # only when the audit shows its base group's intervention rate is driven by
    # that package; never on an untested assumption alone.
    groups:
      # --- Earned split-outs (listed first to win precedence) ---
      react:
        # FUNCTIONAL split (cross-boundary lockstep). react + react-dom (prod) and
        # their @types (dev) ship on one version line; the @types track react's
        # major. A base group is per-boundary, so only a dedicated all-update-
        # types group keeps the prod and dev halves aligned.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      typescript:
        # DATA split. The compiler itself: the 6→7 major failed Lint+Build across
        # #461/#480/#485/#490 and never merged. Isolating major/minor keeps a
        # stuck compiler bump from blocking the dev batch; a patch rides the
        # dev-dependencies base group.
        patterns:
          - "typescript"
        update-types:
          - "major"
          - "minor"
      # --- Base groups (the default home for everything else) ---
      dev-dependencies:
        # Every development dependency, all update types, in one weekly PR.
        dependency-type: development
        patterns:
          - "*"
      production-dependencies:
        # Every production dependency, all update types, in one weekly PR.
        dependency-type: production
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all GitHub Actions updates together (no patch/minor split).
    groups:
      github-actions:
        patterns:
          - "*"
