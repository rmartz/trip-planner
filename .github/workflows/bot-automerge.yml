name: bot-automerge

# Enables GitHub-native auto-merge for trusted bot PRs (Dependabot patch/minor
# bumps) via the @rmartz/bot-automerge-action composite Action, so low-impact
# dependency bumps land without hand-holding while human PRs stay gated exactly as
# before. The Action only makes an eligible bot PR auto-merge; the repo's required
# status checks — including merge-safety — are what actually gate the merge.
#
# Uses pull_request_target (not pull_request): a Dependabot PR runs with a
# read-only token, and enabling auto-merge needs base-context write. Dependabot's
# github-actions ecosystem keeps the @<sha> pins current.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge
  packages: read # install the public @rmartz/bot-automerge package

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of checking out and installing the CLI just to no-op.
    # The three conditions mirror the CLI's own detectBotPrType exactly —
    # Dependabot by author, release-please by branch prefix OR pending label — so
    # nothing eligible is skipped. It is deliberately not an author test:
    # release-please run under a PAT authors its release PR as that real user, not
    # a [bot] account, so an author-only guard would skip release PRs.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
      || contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rmartz/bot-automerge-action@5ce5706808ecf07238081047327e1908255da4df # v1.0.1
        with:
          pr: ${{ github.event.pull_request.number }}
