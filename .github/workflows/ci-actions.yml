name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same PR/ref; never cancel a push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether the heavy code-validation jobs (Tests, Build, Typecheck) need
  # to run for this event. The rule is a DENYLIST, never an allowlist: run the
  # full suite by default and skip only when EVERY changed file is provably-inert
  # documentation. A new or unanticipated file type therefore fails *safe* (runs
  # the suite) rather than *open* (skips it). See issue #392. Pushes to main
  # always run (post-merge: don't try to be clever).
  #
  # The Storybook jobs (Storybook Tests, Storybook Build) are no longer here —
  # they moved to storybook-tests.yml, which delegates to the shared
  # rmartz/storybook-ci reusable workflow and reimplements this same denylist as
  # its own `detect-changes` job (#554).
  detect-changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Non-PR events (push to main) always run the full suite.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event '$EVENT_NAME' is not a pull_request; running full suite."
            echo "code_changed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"

          if [ -z "$changed" ]; then
            echo "No changed files detected; running full suite (fail safe)."
            echo "code_changed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed"

          # A file is inert (skippable docs) only if it matches one of these.
          # Anything else flips code_changed=true.
          is_inert() {
            case "$1" in
              LICENSE) return 0 ;;
              docs/*) return 0 ;;
              *.md) return 0 ;;
              *.txt) return 0 ;;
              *) return 1 ;;
            esac
          }

          code_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! is_inert "$file"; then
              echo "Non-inert file triggers full suite: $file"
              code_changed=true
              break
            fi
          done <<EOF
          $changed
          EOF

          echo "code_changed=$code_changed"
          echo "code_changed=$code_changed" >>"$GITHUB_OUTPUT"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm tsc
