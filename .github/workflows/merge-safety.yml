name: merge-safety

# Posts the `merge-safety` check-run carrying the base-currency / breaking-change
# / conflict verdict for each open PR, and re-holds every PR when main moves — the
# safety verdict that gates trusted bot auto-merge (see bot-automerge, #539).
# Thin caller for the @rmartz/merge-safety reusable workflow; Dependabot's
# github-actions ecosystem keeps the @<sha> pin current.
#
# Uses pull_request_target (not pull_request): GitHub cannot build the merge
# commit for a conflicting PR, so a pull_request run never dispatches there — and
# a required check that never appears hangs the PR forever. The reusable job
# checks out the base ref and runs the published CLI over the PR head as git data
# only, never executing PR-authored code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  checks: write # post/flip the merge-safety check-run
  pull-requests: write # reconcile update-required / merge-conflict labels
  contents: read
  actions: write # dispatch per-PR evaluate runs on the push fan-out
  packages: read # install the CLI from GitHub Packages

jobs:
  merge-safety:
    uses: rmartz/merge-safety/.github/workflows/merge-safety.yml@db145fb8c20164185eb9e1a1c237dc4d9085c69f # v0.1.0
    with:
      pr: ${{ inputs.pr }} # thread the workflow_dispatch input through
    secrets: inherit
