name: Preview Deploy

# Label-driven Vercel preview deploy via the shared rmartz/vercel-preview-ci
# reusable workflow (#557, originally #410). A PR gets a preview only while it
# carries `UAT ready` (the legacy `ready for UAT` is also accepted during the
# rename); it is redeployed on each new push and the URL is posted as a sticky PR
# comment. The gate, fork safety, and per-PR concurrency live in the shared
# workflow: https://github.com/rmartz/vercel-preview-ci/blob/main/docs/consuming.md
#
# This is the sole preview path: vercel.json's `git.deploymentEnabled` disables
# Vercel's Git-integration deploys for every branch except `main`.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  preview:
    uses: rmartz/vercel-preview-ci/.github/workflows/vercel-preview.yml@0c0611a278f9818849f3de35167d4c1192c5661d # v1.0.1
    secrets: inherit
